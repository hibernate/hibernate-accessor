# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '17'
            distribution: 'temurin'
            test-java-version: 17
            coverage: false
          - java-version: '21'
            distribution: 'temurin'
            test-java-version: 21
            coverage: false
          - java-version: '25'
            distribution: 'temurin'
            test-java-version: 25
            coverage: true
          - java-version: '26'
            distribution: 'temurin'
            test-java-version: 26
            coverage: false
          - java-version: '27'
            distribution: 'temurin'
            test-java-version: 27
            coverage: false
          - java-version: '28-ea'
            distribution: 'temurin'
            test-java-version: 28
            coverage: false
            # also test a few other distributions, as there known to be issues when switching from hotspot
          - java-version: '25'
            distribution: 'semeru'
            test-java-version: 25
            coverage: false
          - java-version: '25'
            distribution: 'corretto'
            test-java-version: 25
            coverage: false
          - java-version: '25'
            distribution: 'redhat'
            test-java-version: 25
            coverage: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
    # Checkstyle enforces this for the files it processes; this covers all the other ones.
    # Only on Linux: the check is OS-independent, no point in paying for it twice.
    - name: Check that no license header was reintroduced
      if: matrix.coverage
      run: ./ci/check-no-license-headers.sh
    - name: Set up JDK 25 (Gradle runner)
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # 6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Record Gradle runner home
      run: echo "GRADLE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Set up test JDK ${{ matrix.java-version }}
      if: matrix.java-version != '25'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # 6.1.0
      with:
        java-version: '${{ matrix.java-version }}'
        distribution: ${{ matrix.distribution }}
    - name: Build with Gradle
      env:
        JAVA_HOME: ${{ env.GRADLE_JAVA_HOME }}
      run: ./gradlew build "-PtestJavaVersion=${{ matrix.test-java-version }}"
    - name: Store coverage report
      if: matrix.coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-coverage-data
        retention-days: 1
        path: |
          ./**/build/jacoco/*.exec

  prepare-sonar-bundle:
    name: Prepare build bundle for Sonar scanner
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          pattern: build-coverage-data*
          path: .
          merge-multiple: 'true'
        # Don't fail the build if there are no matching artifacts
        continue-on-error: true

      - name: Merge Jacoco Reports
        run: ./gradlew mergeCodeCoverageReport copyDependenciesSonar --no-parallel

      - name: Store build info for Sonar scanning
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-results-data
          retention-days: 1
          path: |
            ./**/build/jacoco/*.exec
            ./**/build/classes/
            ./**/build/generated/
            ./**/build/resources/
            ./**/build/reports/
            ./**/build/sonar-dependencies/
