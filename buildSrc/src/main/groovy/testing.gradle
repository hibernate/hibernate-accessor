// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Module that need testing
//		- automatically applied by published-java-module
// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

plugins {
	id "java-module"
	id "jacoco"
}

dependencies {
	testImplementation libs.test.assertjCore

	testImplementation libs.test.junitJupiterApi
	testImplementation libs.test.junitJupiterEngine
	testImplementation libs.test.junitJupiterParams
	testRuntimeOnly libs.test.junitPlatformLauncher

	testImplementation libs.test.log4jCore
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	jvmArgs "-Xverify:all"

	jacoco {
		// The agent cannot instrument classes of the JDK it runs on when that JDK is newer than the agent's ASM support.
		excludes = ['java.*', 'javax.*', 'jdk.*', 'sun.*', 'com.sun.*']
	}

	// CI selects the exact installation. Local builds can also select a toolchain by version.
	def testJavaExecutable = providers.gradleProperty("testJavaExecutable").orNull
	def testJavaVersion = providers.gradleProperty("testJavaVersion").orNull
	if (testJavaExecutable != null) {
		executable = testJavaExecutable
	}
	else if (testJavaVersion != null) {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(testJavaVersion as int)
		}
	}
	if (testJavaExecutable != null || testJavaVersion != null) {
		doFirst {
			def launcher = javaLauncher.get()
			logger.lifecycle("Running tests with JDK ${launcher.metadata.languageVersion} (${launcher.metadata.vendor}) from ${launcher.metadata.installationPath}")
		}
	}
}



// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// JaCoCo
// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

def jacocoReportTask = tasks.named( "jacocoTestReport" ) {
	dependsOn tasks.named( "test" )
}

jacocoTestReport {
	reports {
		xml.required = false
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir( "jacocoHtml" )
	}
}

tasks.named( "check" ) {
	dependsOn jacocoReportTask
}
